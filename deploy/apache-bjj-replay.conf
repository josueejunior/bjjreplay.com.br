# HTTP — proxy + redirect HTTPS (certbot)
<VirtualHost *:80>
    ServerName bjj-replay.asteron.digital

    DocumentRoot /var/www/html
    Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge
    <Directory "/var/www/html/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass /.well-known/acme-challenge !
    ProxyPass /api http://127.0.0.1:7871/api retry=0 timeout=120
    ProxyPassReverse /api http://127.0.0.1:7871/api
    LimitRequestBody 20971520
    ProxyPass / http://127.0.0.1:7870/
    ProxyPassReverse / http://127.0.0.1:7870/

    ErrorLog ${APACHE_LOG_DIR}/bjj-replay.asteron.digital-error.log
    CustomLog ${APACHE_LOG_DIR}/bjj-replay.asteron.digital-access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =bjj-replay.asteron.digital
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
