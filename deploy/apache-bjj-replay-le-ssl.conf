# HTTPS — API no back (7871), front Next.js (7870)
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName bjj-replay.asteron.digital

    DocumentRoot /var/www/html
    Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge
    <Directory "/var/www/html/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy *>
        Require all granted
    </Proxy>

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass /.well-known/acme-challenge !
    ProxyPass /api http://127.0.0.1:7871/api retry=0 timeout=120
    ProxyPassReverse /api http://127.0.0.1:7871/api
    LimitRequestBody 20971520
    ProxyPass / http://127.0.0.1:7870/
    ProxyPassReverse / http://127.0.0.1:7870/

    ErrorLog ${APACHE_LOG_DIR}/bjj-replay.asteron.digital-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/bjj-replay.asteron.digital-ssl-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/bjj-replay.asteron.digital/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bjj-replay.asteron.digital/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
