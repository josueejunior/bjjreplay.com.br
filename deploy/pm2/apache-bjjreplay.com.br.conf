# Apache — bjjreplay.com.br (HTTP)
# Copie: sudo cp deploy/pm2/apache-bjjreplay.com.br.conf /etc/apache2/sites-available/
#        sudo a2enmod proxy proxy_http rewrite ssl headers
#        sudo a2ensite bjjreplay.com.br.conf && sudo systemctl reload apache2
# SSL: sudo certbot --apache -d bjjreplay.com.br -d www.bjjreplay.com.br

<VirtualHost *:80>
    ServerName bjjreplay.com.br
    ServerAlias www.bjjreplay.com.br

    DocumentRoot /var/www/html
    Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge
    <Directory "/var/www/html/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off

    <Proxy *>
        Require all granted
    </Proxy>

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass /.well-known/acme-challenge !
    ProxyPass /api http://127.0.0.1:7871/api retry=0 timeout=120
    ProxyPassReverse /api http://127.0.0.1:7871/api
    LimitRequestBody 20971520
    ProxyPass / http://127.0.0.1:7870/
    ProxyPassReverse / http://127.0.0.1:7870/

    ErrorLog ${APACHE_LOG_DIR}/bjjreplay.com.br-error.log
    CustomLog ${APACHE_LOG_DIR}/bjjreplay.com.br-access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =bjjreplay.com.br [OR]
    RewriteCond %{SERVER_NAME} =www.bjjreplay.com.br
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
